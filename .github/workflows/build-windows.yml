name: Build Windows EXE

# 触发条件：推送到 main/master、打 tag、或手动触发
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: 编译 Windows 免安装 EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 下载图片优化工具
        shell: powershell
        # 必需工具（oxipng/pngquant/jpegoptim/cjpegli/jpegtran）下载失败会导致脚本 exit 1 并中断构建；
        # 可选工具（zopflipng/pngcrush/svgo 等）失败仅警告不阻断。
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File win/tools/download-tools.ps1 -Destination win/ImageOptim/Tools

      - name: 发布自包含单文件 EXE
        shell: powershell
        run: |
          dotnet publish win/ImageOptim/ImageOptim.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DownloadTools=false

      - name: 校验发布产物包含 Tools 目录
        shell: powershell
        run: |
          $publish = "win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish"
          $toolsDir = Join-Path $publish "Tools"
          if (-not (Test-Path $toolsDir)) {
            Write-Error "Published output is missing the Tools directory: $toolsDir. Optimizer tools were not packaged correctly."
            exit 1
          }
          $required = @("oxipng.exe", "pngquant.exe", "jpegoptim.exe", "cjpegli.exe", "jpegtran.exe")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $toolsDir $_)) }
          if ($missing) {
            Write-Error "Tools directory is missing core tools: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Tools directory check passed, contains: $((Get-ChildItem $toolsDir -Filter '*.exe' | Select-Object -ExpandProperty Name) -join ', ')"

      - name: 列出产物
        shell: powershell
        run: |
          Get-ChildItem -Recurse win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish |
            Select-Object FullName, @{N='Size(KB)';E={[math]::Round($_.Length/1KB,1)}}

      - name: 上传免安装 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: ImageOptim-win-x64-portable
          path: win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish/
          retention-days: 3

      - name: Delete old exe from release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });

            // 保留最新的 N 个 release，删除其余的 exe 附件
            const keepCount = 2;
            const releasesToDelete = releases.data.slice(keepCount);

            for (const release of releasesToDelete) {
              for (const asset of release.assets) {
                if (asset.name.endsWith('.exe')) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner, repo, asset_id: asset.id
                  });
                  console.log(`Deleted: ${asset.name} from release ${release.tag_name}`);
                }
              }
            }
