name: Build Windows EXE

# 触发条件：推送到 main/master、打 tag、或手动触发
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: 编译 Windows 免安装 EXE
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 下载图片优化工具
        shell: powershell
        # 工具下载失败不阻断构建（程序会检测缺失并跳过对应工具），但日志中会显示警告
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File win/tools/download-tools.ps1 -Destination win/ImageOptim/Tools

      - name: 发布自包含单文件 EXE
        shell: powershell
        run: |
          dotnet publish win/ImageOptim/ImageOptim.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DownloadTools=false

      - name: 列出产物
        shell: powershell
        run: |
          Get-ChildItem -Recurse win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish |
            Select-Object FullName, @{N='Size(KB)';E={[math]::Round($_.Length/1KB,1)}}

      - name: 上传免安装 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: ImageOptim-win-x64-portable
          path: win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish/
          retention-days: 30
