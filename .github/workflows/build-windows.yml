name: Build Windows EXE

# 触发条件：推送到 main/master、打 tag、或手动触发
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: 编译 Windows 免安装 EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 契约文件（shared/toolchain.json）与两端实现的一致性检查
      - name: 校验工具链契约
        run: python scripts/check-toolchain.py .

      - name: 下载图片优化工具
        shell: powershell
        # 必需工具（oxipng/pngquant/jpegoptim/cjpegli/jpegtran）下载失败会导致脚本 exit 1 并中断构建；
        # 可选工具（zopflipng/pngcrush/svgo 等）失败仅警告不阻断。
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File win/tools/download-tools.ps1 -Destination win/ImageOptim/Tools

      - name: 发布自包含单文件 EXE
        shell: powershell
        run: |
          dotnet publish win/ImageOptim/ImageOptim.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DownloadTools=false

      - name: 复制优化工具到发布目录
        shell: powershell
        run: |
          $src = "win/ImageOptim/Tools"
          $dst = "win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish/Tools"
          if (-not (Test-Path $src)) {
            Write-Error "Source Tools directory not found: $src"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $dst -Recurse -Force
          $names = (Get-ChildItem $dst -Filter '*.exe' | Select-Object -ExpandProperty Name) -join ', '
          Write-Host "Copied tools to publish directory: $names"

      - name: 校验发布产物包含 Tools 目录
        shell: powershell
        run: |
          $publish = "win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish"
          $toolsDir = Join-Path $publish "Tools"
          if (-not (Test-Path $toolsDir)) {
            Write-Error "Published output is missing the Tools directory: $toolsDir. Optimizer tools were not packaged correctly."
            exit 1
          }
          $required = @("oxipng.exe", "pngquant.exe", "jpegoptim.exe", "cjpegli.exe", "jpegtran.exe")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $toolsDir $_)) }
          if ($missing) {
            Write-Error "Tools directory is missing core tools: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Tools directory check passed, contains: $((Get-ChildItem $toolsDir -Filter '*.exe' | Select-Object -ExpandProperty Name) -join ', ')"

      - name: 列出产物
        shell: powershell
        run: |
          Get-ChildItem -Recurse win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish |
            Select-Object FullName, @{N='Size(KB)';E={[math]::Round($_.Length/1KB,1)}}

      - name: 上传免安装 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: ImageOptim-win-x64-portable
          path: win/ImageOptim/bin/Release/net8.0-windows/win-x64/publish/
          retention-days: 3

      - name: Delete old exe from release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });

            // 只在"确实带 .exe 附件"的 release 之间做保留计数。
            // 原实现按全局顺序 releases.data.slice(keepCount) 截断，会把其他平台
            // （例如以后的 macOS）的 release 也当成本次发布的旧版本，连带删掉它们的 .exe 附件。
            const winReleases = releases.filter((r) =>
              (r.assets || []).some((a) => a.name.endsWith('.exe'))
            );

            // 保留最新的 N 个 Windows release，删除其 exe 附件
            const keepCount = 2;
            const obsolete = winReleases.slice(keepCount);

            for (const release of obsolete) {
              for (const asset of release.assets.filter((a) => a.name.endsWith('.exe'))) {
                await github.rest.repos.deleteReleaseAsset({
                  owner, repo, asset_id: asset.id
                });
                console.log(`Deleted: ${asset.name} from release ${release.tag_name}`);
              }
            }

            console.log(
              `Windows releases with exe assets: ${winReleases.length}, kept: ${Math.min(keepCount, winReleases.length)}`
            );
